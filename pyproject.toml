[tool.poetry]
name = "virl2_client"
version = "2.11.0.dev0"
description = "VIRL2 Client Library"
authors = ["Simon Knight <simknigh@cisco.com>", "Ralph Schmieder <rschmied@cisco.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/ciscodevnet/virl2-client"
repository = "https://github.com/ciscodevnet/virl2-client"
exclude = [
    "tests/**/*",
    "examples/*"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.28.1"

# https://github.com/python-poetry/poetry/pull/606 -- no support for optional dev-deps
# optional package for events
aiohttp = {version = "^3", optional = true}

# optional pyATS package
# (this pulls in a lot more dependencies)
# it does not pull in genie, need to specify extras=["full"] for pyATS.
pyats = {version = "^26", optional = true}

# optional packages for documentation build
sphinx_rtd_theme = {version="^3", optional = true}
# version 8.2 is available but requires python>=3.11
# version 9 is available but requires python>=3.12
sphinx = {version="<8.2", optional = true}

[tool.poetry.group.dev.dependencies]
ruff = "*"
pre-commit = "^4"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
respx = "^0.23.1"

[tool.poetry.extras]
events = ["aiohttp"]
pyats = ["pyats"]
docs = ["sphinx", "sphinx_rtd_theme"]

[tool.poetry.requires-plugins]
poetry-plugin-export = "*"

[tool.ruff]
line-length = 88
target-version = "py310"
fix = true
exclude = ["examples"]

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  "W",
  # pyflakes
  "F",
  # isort
  "I",
  # pylint (ruff's implementation)
  "PL",
  # security (flake8-bandit)
  "S",
  # correctness / footguns
  "B",
  # pyupgrade
  "UP",
  # naming (pep8-naming)
  "N",
  # simplifications / refactors
  "SIM",
  "C4",
  # builtins shadowing
  "A",
  # ruff-specific rules
  "RUF",
  # logging format
  "G",
  # prohibit print()/pprint() in production code
  "T20",
  # datetime timezone awareness
  # NOTE: virl2_client targets py310; if you add a datetime.now()/strptime
  # later, use `from datetime import timezone` and `timezone.utc`, NOT
  # `from datetime import UTC` (the UTC sentinel is py311+ only).
  "DTZ",
  # logging best practices
  "LOG",
  # sys.version checks
  "YTT",
  # raise-style cleanups
  "RSE",
  # import conventions
  "ICN",
  # performance anti-patterns
  "PERF",
  # pytest-style correctness (parametrize types, raises match=, fixture teardown)
  "PT",
  # implicit namespace packages
  "INP",
  # unused function/method/lambda arguments
  "ARG",
  # flake8-blind-except
  "BLE",
  # furbelow (syntax improvements)
  "FURB",
  # flake8-implicit-str-concat
  "ISC",
  # flake8-quotes
  "Q",
  # flake8-future-annotations
  "FA",
  # flake8-print
  "T10",
  # flake8-todos
  "TD",
  # auto-fixable issues
  "FIX",
  # pygrep-hooks
  "PGH",
  # type-checking imports
  "TCH",
  # flake8-pie
  "PIE",
  # flake8-return
  "RET",
]

# Reuse the monorepo core ignore set with PCL-appropriate overrides.
ignore = [
  # line too long -- handled by formatter
  "E501",
  # magic values in comparisons
  "PLR2004",
  # error-suffix-on-exception-name (deferred; coordinated with simple --
  # public API rename is a breaking change)
  "N818",
  # builtin-import-shadowing (TYPE_CHECKING imports of id, type, etc.)
  "A004",
  # invalid-class-name -- intentional lowercase class (property_s)
  "N801",
  # allow explicit pass in placeholder implementations
  "PIE790",
]

[tool.ruff.lint.isort]
known-first-party = ["virl2_client"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["PLR0913", "PLR0915", "S101"]
"tests/**/*.py" = [
  "S101",    # assert in tests
  "S102",    # exec-builtin in tests
  "S104",    # hardcoded-bind-all-interfaces
  "S105",    # hardcoded-password-string
  "S106",    # hardcoded-password-func-arg
  "S108",    # hardcoded-temp-file
  "PLC0415", # import-outside-top-level
  "PLR0913", # too-many-arguments
  "INP001",  # tests/ intentionally has no __init__.py (pytest rootdir collection)
]
# API-driven constructors with many parameters
"virl2_client/virl2_client.py" = ["PLR0913"]
"virl2_client/models/lab.py" = ["PLR0913"]
"virl2_client/models/resource_pool.py" = ["PLR0913"]
"virl2_client/models/system.py" = ["PLR0913"]
"virl2_client/models/user.py" = ["PLR0913"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
