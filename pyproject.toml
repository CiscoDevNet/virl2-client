[project]
name = "virl2_client"
version = "2.10.1"
description = "VIRL2 Client Library"
authors = [
    { name = "Simon Knight", email = "simknigh@cisco.com" },
    { name = "Ralph Schmieder", email = "rschmied@cisco.com" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = ["httpx>=0.28.1,<0.29"]

[project.urls]
Homepage = "https://github.com/ciscodevnet/virl2-client"
Repository = "https://github.com/ciscodevnet/virl2-client"

[project.optional-dependencies]
events = ["aiohttp>=3,<4"]
# This pulls in many dependencies; use `pyats[full]` when Genie is needed.
pyats = ["pyats>=25,<26"]
# Version 8.2.3 is available but requires Python >=3.11.
docs = ["sphinx<8.2", "sphinx-rtd-theme>=3,<4"]

[tool.poetry]
exclude = ["tests/**/*", "examples/*"]

[tool.poetry.group.dev.dependencies]
flake8 = "^7"
pre-commit = "^4"
# Incompatible with pyats.
pytest = "<9.1"
pytest-xdist = "*"
respx = "^0.22.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
